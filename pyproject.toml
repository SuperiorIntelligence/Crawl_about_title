[project]
name = "coffee-price-crawler"
version = "0.4.0"
description = "Find lowest Arabica/Robusta coffee prices (per-gram) across Iranian sellers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
coffee-crawl = "core.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
